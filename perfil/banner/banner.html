<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  body{width:1584px;height:396px;overflow:hidden;font-family:Inter,"Liberation Sans",sans-serif;
    background:radial-gradient(1200px 500px at 85% 20%,#12406a 0%,rgba(18,64,106,0) 60%),
               linear-gradient(120deg,#0a1a2f 0%,#0d2440 55%,#0b1e36 100%);color:#fff;position:relative}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 35%,#000 100%);}
  .content{position:absolute;right:72px;top:0;bottom:0;width:900px;display:flex;flex-direction:column;justify-content:center;gap:18px}
  .kicker{font-size:17px;font-weight:600;letter-spacing:.18em;color:#5eead4;text-transform:uppercase}
  h1{margin:0;font-size:58px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
  h1 span{color:#5eead4}
  .tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
  .tag{font-size:17px;font-weight:500;padding:8px 14px;border-radius:999px;
       border:1px solid rgba(94,234,212,.35);background:rgba(94,234,212,.08);color:#dbeafe}
  .bar{position:absolute;right:0;top:0;bottom:0;width:8px;background:linear-gradient(#5eead4,#3b82f6)}
  svg.flow{position:absolute;left:300px;top:68px;opacity:.55}
</style></head>
<body>
  <div class="grid"></div>
  <!-- abstract data-flow motif, kept away from the profile-photo area (bottom-left) -->
  <svg class="flow" width="260" height="260" viewBox="0 0 300 260" fill="none">
    <g stroke="#5eead4" stroke-width="1.5" stroke-opacity=".6">
      <path d="M20 40 H120 L160 90 H280"/><path d="M20 130 H280"/><path d="M20 220 H120 L160 170 H280"/>
    </g>
    <g fill="#5eead4">
      <circle cx="20" cy="40" r="5"/><circle cx="20" cy="130" r="5"/><circle cx="20" cy="220" r="5"/>
      <circle cx="280" cy="90" r="6"/><circle cx="280" cy="130" r="6"/><circle cx="280" cy="170" r="6"/>
    </g>
    <rect x="200" y="112" width="36" height="36" rx="8" stroke="#3b82f6" stroke-width="2" fill="#0d2440"/>
    <path d="M209 130 l6 6 l12 -13" stroke="#5eead4" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="content">
    <div class="kicker">SAP Vendor Master Data · Data Governance · Procure-to-Pay</div>
    <h1>Clean data. <span>Safe payments.</span></h1>
    <div class="tags">
      <div class="tag">SAP MM / FI</div>
      <div class="tag">SOX Controls</div>
      <div class="tag">Payment Fraud Prevention</div>
      <div class="tag">Power Automate</div>
      <div class="tag">SAP GUI Scripting</div>
    </div>
  </div>
  <div class="bar"></div>
</body></html>
